plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.simple.recorder'
    compileSdk 35

    defaultConfig {
        applicationId 'tv.simple.recorder'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.0'
    }

    signingConfigs {
        // Ключ лежит в репозитории, чтобы каждая сборка на GitHub подписывалась одинаково:
        // тогда новую версию можно ставить поверх старой без удаления.
        // Это открытый debug-ключ для ручной установки, не для публикации в магазинах.
        release {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
